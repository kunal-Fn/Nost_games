<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#1d2327">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../icons/icon-192.png">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Nost Games">
  <title>Brick Breaker</title>
  <link rel="stylesheet" href="../shared/phone.css">
</head>
<body>
  <main class="phone">
    <div class="brand"><a class="back" href="../../">◀ Menu</a>NOST GAMES</div>

    <div class="screen">
      <div class="hud">
        <span id="score">0000</span>
        <span id="status" class="mid">L1 ♥3</span>
        <span id="best">HI 0000</span>
      </div>
      <div class="board">
        <canvas id="game"></canvas>
        <div id="overlay" class="overlay"></div>
      </div>
    </div>

    <div class="softkeys">
      <button id="sound" class="softkey" type="button">Sound: on</button>
      <button id="pause" class="softkey" type="button">Pause</button>
    </div>

    <!-- 4/6 move the paddle, 2 and 5 launch the ball. 5 doesn't pause here: it sits between
         4 and 6, so thumbs hit it by accident. Pausing is on the Pause soft key instead. -->
    <div class="keypad wide">
      <span></span>
      <button class="key" data-action="launch" type="button">2<small>▲</small></button>
      <span></span>
      <button class="key" data-dir="left" type="button">4<small>◀</small></button>
      <button class="key" data-action="launch" type="button">5<small>●</small></button>
      <button class="key" data-dir="right" type="button">6<small>▶</small></button>
    </div>

    <p class="help">Arrows / A D / 4 6 to move · 2, 5 or Up to launch · Pause key or Space to pause · drag on the screen</p>
  </main>

  <script src="bricks.js"></script>
  <script src="../shared/install.js" data-root="../../"></script>
</body>
</html>
