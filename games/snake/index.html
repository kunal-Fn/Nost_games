<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#1d2327">
  <title>Snake</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="phone">
    <div class="brand">NOST GAMES</div>

    <div class="screen">
      <div class="hud">
        <span id="score">0000</span>
        <span id="best">HI 0000</span>
      </div>
      <div class="board">
        <canvas id="game"></canvas>
        <div id="overlay" class="overlay"></div>
      </div>
    </div>

    <div class="softkeys">
      <button id="sound" class="softkey" type="button">Sound: on</button>
      <button id="pause" class="softkey" type="button">Pause</button>
    </div>

    <!-- Nokia-style keypad: 2/4/6/8 steer, 5 pauses or starts. -->
    <div class="keypad">
      <span></span>
      <button class="key" data-dir="up" type="button">2<small>▲</small></button>
      <span></span>
      <button class="key" data-dir="left" type="button">4<small>◀</small></button>
      <button class="key" data-action="toggle" type="button">5<small>●</small></button>
      <button class="key" data-dir="right" type="button">6<small>▶</small></button>
      <span></span>
      <button class="key" data-dir="down" type="button">8<small>▼</small></button>
      <span></span>
    </div>

    <p class="help">Arrows / WASD / 2 4 6 8 to move · Space or 5 to pause · swipe on the screen</p>
  </main>

  <script src="snake.js"></script>
</body>
</html>
