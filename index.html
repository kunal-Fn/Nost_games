<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d2327">
  <title>Nost Games</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #0e1214;
      color: #dfe6e9;
      font-family: "Courier New", monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
      box-sizing: border-box;
    }
    h1 {
      letter-spacing: 6px;
      margin: 0 0 28px;
    }
    a.game {
      display: block;
      width: min(360px, 100%);
      box-sizing: border-box;
      background: #c7f0d8;
      color: #43523d;
      text-decoration: none;
      border: 6px solid #1d2327;
      border-radius: 12px;
      padding: 18px;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 14px;
    }
    a.game small {
      display: block;
      font-size: 13px;
      font-weight: normal;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h1>NOST GAMES</h1>
  <a class="game" href="games/snake/">SNAKE<small>The classic phone game</small></a>
</body>
</html>
